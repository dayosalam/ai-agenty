# Local infra for Peermate. The Node app runs on the host (npm run dev) so the
# Baileys QR appears in your terminal; only the stateful pieces live in Docker.

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-peermate-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-peermate-local-dev}
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # The JS Chroma client is HTTP-only — unlike Python there is no embedded mode,
  # so this server is required, not optional.
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  minio_data:
  chroma_data:
